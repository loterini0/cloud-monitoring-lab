name: Cloud Monitoring API - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar sintaxis Python
        run: python -m compileall -q app.py

      - name: Construir imagen Docker
        run: docker build -t cloud-monitoring-api:test .
